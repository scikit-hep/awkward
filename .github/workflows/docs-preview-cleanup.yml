name: Docs Preview Cleanup
on: # zizmor: ignore[dangerous-triggers] This privileged workflow only removes a preview directory.
  pull_request_target:
    types: [closed]

concurrency:
  group: docs-preview-cleanup-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  remove-branch-preview:
    runs-on: ubuntu-slim
    name: Remove Branch Preview
    permissions:
      contents: read
    env:
      S3_BUCKET: "preview-awkward-array-org"
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_REGION: auto
      RCLONE_CONFIG_R2_ENDPOINT: "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
      # The token may only read and write objects, so never try to create the bucket
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
    environment:
      name: docs
    steps:
    - name: Install rclone
      # The rclone packaged by Ubuntu (1.60) sends the version ID that R2 returns
      # for an upload back with the HEAD that checks it, which R2 rejects
      env:
        VERSION: v1.75.1
        SHA256: 09c9f7606ed9e31eecc1eec26a89992cf2931a8d2d1a5f0ae2bb1c11630ffb15
      run: |
        curl --silent --show-error --fail --location --output "${RUNNER_TEMP}/rclone.deb" \
          "https://github.com/rclone/rclone/releases/download/${VERSION}/rclone-${VERSION}-linux-amd64.deb"
        echo "${SHA256}  ${RUNNER_TEMP}/rclone.deb" | sha256sum --check --strict
        sudo dpkg --install "${RUNNER_TEMP}/rclone.deb"
    # Previews are never overwritten by a later pull request, so they would
    # otherwise accumulate in the bucket for as long as the project lives
    - name: Remove artifacts
      env:
        PR_NUMBER: ${{ github.event.number }}
      # There is no preview to remove if the docs never built for this pull
      # request, and rclone fails to purge a directory that does not exist.
      # The listing is captured first so that a failed listing fails the step
      # rather than looking like a missing preview
      run: |
        previews="$(rclone lsf --dirs-only "r2:${S3_BUCKET}/")"
        if grep --quiet --line-regexp "PR${PR_NUMBER}/" <<< "${previews}"; then
          rclone purge "r2:${S3_BUCKET}/PR${PR_NUMBER}/"
        fi
