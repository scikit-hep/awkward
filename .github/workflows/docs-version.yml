name: Sync Docs Selector

on:
  push:
    branches:
      - main
    paths:
      - docs/switcher.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'docs-version-${{ github.head_ref || github.run_id }}'
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-slim
    name: Push version switcher
    permissions:
      contents: read
    env:
      S3_BUCKET: "awkward-array-org"
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_REGION: auto
      RCLONE_CONFIG_R2_ENDPOINT: "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
      # The token may only read and write objects, so never try to create the bucket
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
    environment:
      name: docs
    steps:
      - name: Install rclone
        # The rclone packaged by Ubuntu (1.60) sends the version ID that R2 returns
        # for an upload back with the HEAD that checks it, which R2 rejects
        env:
          VERSION: v1.75.1
          SHA256: 09c9f7606ed9e31eecc1eec26a89992cf2931a8d2d1a5f0ae2bb1c11630ffb15
        run: |
          curl --silent --show-error --fail --location --output "${RUNNER_TEMP}/rclone.deb" \
            "https://github.com/rclone/rclone/releases/download/${VERSION}/rclone-${VERSION}-linux-amd64.deb"
          echo "${SHA256}  ${RUNNER_TEMP}/rclone.deb" | sha256sum --check --strict
          sudo dpkg --install "${RUNNER_TEMP}/rclone.deb"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pushes to main trigger latest
      - name: Push version selector
        run: |
          rclone copyto --checksum \
            docs/switcher.json "r2:${S3_BUCKET}/doc/switcher.json"
      - name: Purge the Cloudflare cache
        uses: ./.github/actions/purge-cloudflare-cache
        with:
          zone-id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
