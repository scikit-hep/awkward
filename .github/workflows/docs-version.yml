name: Sync Docs Selector

on:
  push:
    branches:
      - main
    paths:
      - docs/switcher.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'docs-version-${{ github.head_ref || github.run_id }}'
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-22.04
    name: Push version switcher
    permissions:
      contents: read
    env:
      S3_BUCKET: "awkward-array-org"
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      # R2 is a single global bucket, but the CLI still wants a region
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
      # R2 rejects the additional checksums that recent versions of the AWS CLI
      # send by default
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    environment:
      name: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pushes to main trigger latest
      - name: Push version selector
        run: |
          aws s3 cp --endpoint-url "${R2_ENDPOINT}" \
            docs/switcher.json "s3://${S3_BUCKET}/doc/switcher.json"
      - name: Purge the Cloudflare cache
        uses: ./.github/actions/purge-cloudflare-cache
        with:
          zone-id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
