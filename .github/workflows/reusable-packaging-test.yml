name: Packaging Tests

on:
  workflow_call:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-test-${{ github.head_ref }}
  cancel-in-progress: true

env:
  SOURCE_DATE_EPOCH: "1668811211"

jobs:
  build_awkward_sdist_wheel:
    name: "Build awkward"
    runs-on: ubuntu-slim
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: true
        persist-credentials: false

    - name: Prepare build files
      run: pipx run nox -s prepare

    - name: Build awkward SDist & wheel
      run: pipx run build

    - name: Check metadata
      run: pipx run twine check dist/*

    - name: Build awkward-cpp SDist
      run: pipx run build --sdist awkward-cpp

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: awkward-sdist
        path: dist/*.tar.gz

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: awkward-wheel
        path: dist/*.whl

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: awkward-cpp-sdist
        path: awkward-cpp/dist/*.tar.gz


  build_cpp_wheels:
    name: "Build awkward-cpp: ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-11-arm, windows-latest, macos-latest, ubuntu-latest]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: true
        persist-credentials: false

    - name: Setup uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

    - uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299 # v4.3.1
      env:
        CIBW_ARCHS_MACOS: universal2
        CIBW_ARCHS_WINDOWS: auto64
        CIBW_BUILD: cp311-win_* cp310-macosx_universal2 cp310-manylinux_x86_64 cp312-manylinux_x86_64
      with:
        package-dir: awkward-cpp

    - name: Upload wheels
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: awkward-cpp-wheels-${{ matrix.os }}
        path: wheelhouse/*.whl

  build_cpp_pyodide_wheels:
    name: "Build awkward-cpp: pyodide"
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: true
        persist-credentials: false

    - name: Setup uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

    # The pyodide cross-build cannot generate the kernel tests (no host numpy)
    - name: Generate kernel tests for the wheel test suite
      run: pipx run nox -s prepare -- --tests

    - uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299 # v4.3.1
      env:
        CIBW_PLATFORM: pyodide
        CIBW_BUILD: cp314-pyodide_wasm32
      with:
        package-dir: awkward-cpp

    - name: Upload wheels
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: awkward-cpp-wheels-pyodide
        path: wheelhouse/*.whl
