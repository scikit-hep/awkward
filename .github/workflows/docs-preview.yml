name: Docs Preview
on: # zizmor: ignore[dangerous-triggers] This privileged workflow only deploys artifacts from a completed CI run.
  workflow_run:
    workflows: [CI]
    types:
      - completed

concurrency:
  group: docs-preview-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  branch-preview:
    runs-on: ubuntu-slim
    name: Deploy Branch Preview
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    permissions:
      contents: read
      actions: read # Required to download the artifacts of the CI run.
      pull-requests: write # Required to comment with the preview URL.
    env:
      S3_BUCKET: "preview-awkward-array-org"
      DEPLOY_URL: "https://preview.awkward-array.org"
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_REGION: auto
      RCLONE_CONFIG_R2_ENDPOINT: "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
      # The token may only read and write objects, so never try to create the bucket
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
    environment:
      name: docs
      url: "${{ env.DEPLOY_URL }}/PR${{ steps.pr_number.outputs.pr_number }}/"
    steps:
    - name: Install rclone
      # The rclone packaged by Ubuntu (1.60) sends the version ID that R2 returns
      # for an upload back with the HEAD that checks it, which R2 rejects
      env:
        VERSION: v1.75.1
        SHA256: 09c9f7606ed9e31eecc1eec26a89992cf2931a8d2d1a5f0ae2bb1c11630ffb15
      run: |
        curl --silent --show-error --fail --location --output "${RUNNER_TEMP}/rclone.deb" \
          "https://github.com/rclone/rclone/releases/download/${VERSION}/rclone-${VERSION}-linux-amd64.deb"
        echo "${SHA256}  ${RUNNER_TEMP}/rclone.deb" | sha256sum --check --strict
        sudo dpkg --install "${RUNNER_TEMP}/rclone.deb"
    - name: Download rendered docs
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          let allArtifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
          });
          let docsArtifact = allArtifacts.data.artifacts.filter((artifact) => {
            return artifact.name == "docs"
          })[0];
          let PRNumberArtifact = allArtifacts.data.artifacts.filter((artifact) => {
            return artifact.name == "pr_number"
          })[0];
          let downloadDocs = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: docsArtifact.id,
              archive_format: 'zip',
          });
          let downloadPRNumber = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: PRNumberArtifact.id,
              archive_format: 'zip',
          });
          const fs = require('fs');
          const path = require('path');
          const temp = path.join(process.env.RUNNER_TEMP, 'artifacts');
          if (!fs.existsSync(temp)){
            fs.mkdirSync(temp);
          }
          fs.writeFileSync(path.join(temp, 'docs.zip'), Buffer.from(downloadDocs.data));
          fs.writeFileSync(path.join(temp, 'pr_number.zip'), Buffer.from(downloadPRNumber.data));
    - name: Unzip artifacts
      run: |
        unzip "${RUNNER_TEMP}/artifacts/docs.zip" -d "${RUNNER_TEMP}/artifacts"
        unzip "${RUNNER_TEMP}/artifacts/pr_number.zip" -d "${RUNNER_TEMP}/artifacts"
    - name: Read PR number
      id: pr_number
      run: |
        pr_number=$(cat "${RUNNER_TEMP}/artifacts/pr_number.txt")
        # The number is written by an unprivileged workflow, and is used below
        # as a path in the preview bucket
        if ! [[ "${pr_number}" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::Invalid PR number"
          exit 1
        fi
        echo "pr_number=${pr_number}" >> "${GITHUB_OUTPUT}"
        rm "${RUNNER_TEMP}/artifacts/pr_number.txt"
        rm "${RUNNER_TEMP}/artifacts/docs.zip"
        rm "${RUNNER_TEMP}/artifacts/pr_number.zip"
    - name: Sync artifacts
      # A preview is replaced in place every time its pull request is pushed
      # to, so let the edge revalidate it rather than purging the zone for
      # every push
      run: |
        rclone sync --checksum --transfers 16 \
          --header-upload "Cache-Control: public, max-age=0, must-revalidate" \
          "${RUNNER_TEMP}/artifacts/" "r2:${S3_BUCKET}/PR${STEPS_PR_NUMBER_OUTPUTS_PR_NUMBER}/"
      env:
        STEPS_PR_NUMBER_OUTPUTS_PR_NUMBER: ${{ steps.pr_number.outputs.pr_number }}
    - name: Try to find previous bot comment
      uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
      id: fc
      with:
        issue-number: ${{ steps.pr_number.outputs.pr_number }}
        comment-author: 'github-actions[bot]'
        body-includes: The documentation preview is ready to be viewed
    - name: Create comment with preview link
      if: steps.fc.outputs.comment-id == ''
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ steps.pr_number.outputs.pr_number }}
        PREVIEW_URL: ${{ env.DEPLOY_URL }}/PR${{ steps.pr_number.outputs.pr_number }}/
      run: gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body "The documentation preview is ready to be viewed at <${PREVIEW_URL}>"
