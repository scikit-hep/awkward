name: Codecov

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: true

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'coverage-${{ github.head_ref || github.run_id }}'
  cancel-in-progress: true

env:
  # Leverage reproducible builds by setting a constant SOURCE_DATE_EPOCH
  # This will ensure that the hash of the awkward-cpp directory remains
  # constant for unchanged files, meaning that it can be used for caching
  SOURCE_DATE_EPOCH: "1668811211"

jobs:
  coverage:
    runs-on: self-hosted
    name: Run Codecov

    env:
      PIP_ONLY_BINARY: cmake
      # The RAPIDS wheels installed below are cp311-abi3: 3.10 has no cudf to
      # install. 3.13 matches the GPU test jobs (see .github/actions/setup-gpu-env).
      PYTHON_VERSION: "3.13"
      # Those wheels go in with --no-deps, so pip does not check them against
      # one another; keep them pinned to a single release series.
      RAPIDS_VERSION: "26.8.*"
      # The runner has many cores; without these limits, JAX/XLA, OpenBLAS,
      # OpenMP, and numexpr each spawn a worker thread per core in the one
      # test process. PJRT_NPROC caps the XLA CPU client's thread pools
      # (xla/pjrt/utils.cc, DefaultThreadPoolSize).
      PJRT_NPROC: "2"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_MAX_THREADS: "4"

    # Required for miniconda to activate conda
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Clean the workspace and mamba
        run: |
          rm -rf * .[!.]* || echo "Nothing to clean"
          rm -rf ~/micromamba* || echo "Nothing to clean"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Get micromamba
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-name: test-env
          init-shell: bash
          # cudf is deliberately absent: with it in the solve, the create
          # step fails on this runner before any test runs. It is installed
          # from wheels once this environment is in place (see below), which
          # is also why the rapidsai channel is no longer needed here.
          # pandas is bounded to the window cudf supports, because the wheels
          # go in with --no-deps and so cannot correct it themselves; it needs
          # to move with RAPIDS_VERSION.
          create-args: >-
            python=${{ env.PYTHON_VERSION }}
            pandas>=3.0.0,<3.0.4
            cccl-python>=1.0.2
            cupy>=14
            cuda-version=13
            cuda-toolkit
            cxx-compiler
            numba-cuda
            root=6.36.06
            pipx

      - name: Generate build files
        run: pipx run nox -s prepare -- --headers --signatures --tests

      - name: Cache awkward-cpp wheel
        id: cache-awkward-cpp-wheel
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./awkward-cpp/dist
          key: ${{ github.job }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('awkward-cpp/**') }}

      - name: Build awkward-cpp wheel
        if: steps.cache-awkward-cpp-wheel.outputs.cache-hit != 'true'
        run: |
          python -m pip install build
          python -m build -w ./awkward-cpp
          ls ./awkward-cpp/dist

      - name: Install awkward-cpp
        run: python -m pip install -v ./awkward-cpp/dist/*.whl

      - name: Build & install awkward
        run: python -m pip install -v .

      - name: Print versions
        run: python -m pip list

      - name: Install test requirements
        run: python -m pip install -v -r requirements-test-full.txt -r requirements-test-gpu.txt

      # Installed last, and with --no-deps, so that pip adds the RAPIDS stack
      # and nothing else: cudf's own requirements name cupy-cuda13x, pandas,
      # numpy, numba-cuda and pyarrow, and letting pip resolve them would put
      # a second cupy on top of the conda one (both ship the `cupy` package)
      # and pull a duplicate CUDA toolkit. cuda-bindings, cuda-core and
      # cuda-pathfinder already arrive with conda numba-cuda, so the list below
      # is only what the environment is actually missing.
      - name: Install cudf
        run: |
          python -m pip install -v --no-deps \
            "cudf-cu13==${RAPIDS_VERSION}" \
            "pylibcudf-cu13==${RAPIDS_VERSION}" \
            "libcudf-cu13==${RAPIDS_VERSION}" \
            "rmm-cu13==${RAPIDS_VERSION}" \
            "librmm-cu13==${RAPIDS_VERSION}" \
            "libkvikio-cu13==${RAPIDS_VERSION}" \
            "nvidia-libnvcomp-cu13==5.3.0.16" \
            "rapids-logger==0.2.*" \
            numba-cuda-mlir \
            nvtx
          # Pure-Python imports of cudf, resolved normally: nothing they pull
          # in overlaps with the solved environment.
          python -m pip install cachetools rich

      # tests-cuda/test_3946_from_cudf*.py open with pytest.importorskip("cudf"),
      # so an incomplete install would skip them silently and look exactly like
      # the missing patch coverage this is meant to fix. Fail loudly instead.
      - name: Check cudf is usable
        run: |
          python -c "import cudf, pylibcudf, cupy; print('cudf', cudf.__version__, '| cupy', cupy.__version__)"

      - name: Test
        run: >-
          python -m pytest -vv -rs tests --cov=awkward --cov-report=term
          --cov-report=xml:non-cuda-coverage.xml --junitxml=junit.xml -o junit_family=legacy

      - name: Test CUDA
        run: >-
          python -m pytest -vv -rs tests-cuda --ignore=tests-cuda/test_3459_virtualarray_with_cuda.py
          --cov=awkward --cov-report=term --cov-report=xml:cuda-coverage.xml

      - name: Test CUDA virtual arrays
        run: >-
          python -m pytest -vv -rs tests-cuda/test_3459_virtualarray_with_cuda.py
          --cov=awkward --cov-report=term --cov-report=xml:cuda-virtual-coverage.xml

      - name: Upload Codecov results
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
