name: Build wheels

on:
  # Run daily at 1:23 UTC
  schedule:
    - cron: '23 1 * * *'
  # Run on demand with workflow dispatch
  workflow_dispatch:
  # Use from other workflows
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  determine-source-date-epoch:
    name: "Determine SOURCE_DATE_EPOCH"
    if: github.event_name != 'schedule' || github.repository_owner == 'scikit-hep'
    runs-on: ubuntu-slim
    outputs:
      source-date-epoch: ${{ steps.log.outputs.source-date-epoch }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false

      - id: log
        name: Compute SOURCE_DATE_EPOCH
        run: |
          # Find latest unix timestamp in awkward-cpp, and the kernel generation files
          epoch=$( git log -1 --format=%at -- awkward-cpp kernel-specification.yml kernel-test-data.json )
          echo "source-date-epoch=$epoch" >> $GITHUB_OUTPUT

  make_sdist:
    name: "Build awkward-cpp sdist"
    if: github.event_name != 'schedule' || github.repository_owner == 'scikit-hep'
    runs-on: ubuntu-slim
    needs: [determine-source-date-epoch]
    env:
      SOURCE_DATE_EPOCH: ${{ needs.determine-source-date-epoch.outputs.source-date-epoch }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: true
        persist-credentials: false

    - name: Build awkward-cpp sdist
      run: pipx run build --sdist awkward-cpp

    - name: Check metadata
      run: pipx run twine check awkward-cpp/dist/*

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: awkward-cpp-sdist
        path: awkward-cpp/dist/*.tar.gz

  build_wheels:
    needs: [determine-source-date-epoch]
    name: "Wheel awkward-cpp: ${{ matrix.arch }} on ${{ matrix.os }}"
    if: github.event_name != 'schedule' || github.repository_owner == 'scikit-hep'
    runs-on: ${{ matrix.os }}
    env:
      SOURCE_DATE_EPOCH: ${{ needs.determine-source-date-epoch.outputs.source-date-epoch }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel]
        arch: [auto64]

        include:
        - os: windows-latest
          arch: auto64

        - os: windows-latest
          arch: auto32

        - os: ubuntu-24.04-arm
          arch: auto64

        - os: windows-11-arm
          arch: auto64

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: true
        persist-credentials: false

    - name: Python 3.12
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'

    - name: Setup uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

    - uses: pypa/cibuildwheel@b9e566a2b284570af229f6c2a33673410d0389a3  # v4.3.4
      env:
        CIBW_ARCHS: ${{ matrix.arch }}
      with:
        package-dir: awkward-cpp

    - name: Check metadata
      run: pipx run twine check wheelhouse/*.whl

    - name: Upload wheels
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: awkward-cpp-wheels-${{ matrix.os }}-${{ matrix.arch }}
        path: wheelhouse/*.whl

  build_pyodide_wheels:
    needs: [determine-source-date-epoch]
    name: "Wheel awkward-cpp: pyodide"
    if: github.event_name != 'schedule' || github.repository_owner == 'scikit-hep'
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: ${{ needs.determine-source-date-epoch.outputs.source-date-epoch }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: true
        persist-credentials: false

    - name: Setup uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

    # The pyodide cross-build cannot generate the kernel tests (no host numpy)
    - name: Generate kernel tests for the wheel test suite
      run: pipx run nox -s prepare -- --tests

    - uses: pypa/cibuildwheel@b9e566a2b284570af229f6c2a33673410d0389a3  # v4.3.4
      env:
        CIBW_PLATFORM: pyodide
      with:
        package-dir: awkward-cpp

    - name: Check metadata
      run: pipx run twine check wheelhouse/*.whl

    - name: Upload wheels
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: awkward-cpp-wheels-pyodide
        path: wheelhouse/*.whl

  build_awkward_wheel:
    name: "Build awkward sdist and wheel"
    if: github.event_name != 'schedule' || github.repository_owner == 'scikit-hep'
    runs-on: ubuntu-slim
    needs: [determine-source-date-epoch]
    env:
      SOURCE_DATE_EPOCH: ${{ needs.determine-source-date-epoch.outputs.source-date-epoch }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: true
        persist-credentials: false

    - name: Setup uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

    - name: Prepare build files
      run: pipx run nox -s prepare

    - name: Build distributions
      run: uvx --from build pyproject-build --installer uv

    - name: Check metadata
      run: pipx run twine check dist/*

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: awkward-wheel
        path: dist/*
