codecov:
  require_ci_to_pass: true
  notify:
    # Coverage is uploaded by two jobs (CPU and CUDA); wait for both before
    # reporting, so that a partial report is never posted
    after_n_builds: 2

comment:
  layout: "files"
  after_n_builds: 2

coverage:
  status:
    project:
      default:
        # 'auto' sets the target to our current coverage %
        # 'threshold' allows a tiny 0.5% drop to prevent "flaky" failures
        target: auto
        threshold: 0.5%
    patch:
      default:
        # Ensures 98% of NEW code added in the PR is covered
        target: 98%
        threshold: 0%

github_checks:
  annotations: false

ignore:
  - "src/awkward/_connect/cudf.py"
  - "src/awkward/operations/ak_from_cudf.py"
